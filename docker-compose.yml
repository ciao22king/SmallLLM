version: '3.8'

services:
  smallllm:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DEBUG=false
    restart: unless-stopped
    volumes:
      - ./smallllm_cache:/app/.smallllm_cache

  # Opzionale: web interface separata
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - smallllm
